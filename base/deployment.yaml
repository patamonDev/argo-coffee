apiVersion: apps/v1
kind: Deployment
metadata:
  name: main-deployment
  namespace: coffee-enjoyers
spec:
  replicas: 2
  selector:
    matchLabels:
      deployment: prod
      brew: french-press
  template:
    metadata:
      labels:
        deployment: prod
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
      - name: web-french-press-container
        image: patamondev/coffee-webapp:latest
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            memory: 64Mi