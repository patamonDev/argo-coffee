apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: coffee-webapp-manifest
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/patamonDev/argo-coffee"
    targetRevision: HEAD
  destination:
    namespace: coffee-enjoyers
    server: 'https://kubernetes.default.svc'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true