apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: coffee-webapp-manifest
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/patamonDev/argo-coffee
    targetRevision: main
    path: base            # adjust to match your repo layout
  destination:
    server: https://kubernetes.default.svc
    namespace: coffee-enjoyers
  syncPolicy:
    automated:
      prune: true
      selfHeal: true